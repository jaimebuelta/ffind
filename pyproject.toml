[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ffind"
version = "1.6.1"
description = "Sane replacement for command line file search"
readme = "README.md"
requires-python = ">=3.9,<4"
license = "MIT"
authors = [
    { name = "Jaime Buelta", email = "jaime.buelta@gmail.com" }
]
keywords = ["searching", "file system"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/jaimebuelta/ffind"

[project.scripts]
ffind = "ffind.ffind:run"

[tool.hatch.build.targets.wheel]
packages = ["src/ffind"]

# Ship the man page inside the wheel; pip installs it under the
# environment prefix (share/man/man1) and removes it on uninstall
[tool.hatch.build.targets.wheel.shared-data]
"man_pages/ffind.1" = "share/man/man1/ffind.1"

[tool.hatch.build.targets.sdist]
include = [
    "src/ffind/**/*.py",
    "man_pages/**/*",
] 